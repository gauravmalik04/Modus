<style>
    .brutal-border   { border: 4px solid #1a1a1a; }
    .brutal-border-3 { border: 3px solid #1a1a1a; }
    .brutal-border-b { border-bottom: 4px solid #1a1a1a; }

    /* Nav link hover â€” no black fill on hover */
    .nav-link-player {
        font-family: 'Space Grotesk', sans-serif;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: -0.02em;
        color: #4a4a4a;
        padding: 0.25rem 0.75rem;
        border-bottom: 4px solid transparent;
        text-decoration: none;
        transition: border-color 120ms ease, color 120ms ease;
    }
    .nav-link-player:hover { color: #1a1a1a; border-bottom-color: #e63b2e; }
    .nav-link-player.active { color: #1a1a1a; border-bottom-color: #e63b2e; }

    /* Transport button shared */
    .transport-btn {
        display: flex; align-items: center; justify-content: center;
        background: #ffffff;
        border: 4px solid #1a1a1a;
        box-shadow: 4px 4px 0px 0px #1a1a1a;
        cursor: pointer;
        transition: transform 80ms ease, box-shadow 80ms ease, background 120ms ease, color 120ms ease;
        color: #1a1a1a;
    }
    .transport-btn:hover  { background: #1a1a1a; color: #ffffff; }
    .transport-btn:active { transform: translate(4px,4px); box-shadow: none; }
    .transport-btn.active-toggle { background: #1a1a1a; color: #ffcc00; }

    /* Progress / volume bar cursor */
    #player-scrubber, #player-volume-bar { cursor: pointer; }

    /* Queue item hover */
    .queue-item { transition: background 120ms ease; cursor: pointer; }
    .queue-item:hover { background: #ffcc00 !important; }
    .queue-item.is-current { background: #1a1a1a !important; color: #ffffff !important; }
    .queue-item.is-current .qi-artist { color: rgba(255,255,255,0.65); }
    .queue-item.is-current .qi-num { color: rgba(255,255,255,0.5); }

    /* Mood-reactive background on Now-Playing panel */
    #now-playing-panel { transition: background-color 0.4s ease; }

    /* Side-by-side layout */
    .player-layout {
        display: grid;
        grid-template-columns: 1fr;
        gap: 0;
        min-height: calc(100vh - 80px); /* viewport minus navbar */
    }
    @media (min-width: 1024px) {
        .player-layout {
            grid-template-columns: 60% 40%;
        }
    }

    /* Queue panel â€” scrollable, full height */
    .queue-panel {
        border-left: 0;
        overflow-y: auto;
    }
    @media (min-width: 1024px) {
        .queue-panel {
            border-left: 4px solid #1a1a1a;
            max-height: calc(100vh - 80px);
            position: sticky;
            top: 80px; /* navbar height */
        }
    }

    /* Thin scrollbar for queue */
    .queue-panel::-webkit-scrollbar { width: 6px; }
    .queue-panel::-webkit-scrollbar-track { background: #f5f0e8; }
    .queue-panel::-webkit-scrollbar-thumb { background: #1a1a1a; }
</style>

                            NOW PLAYING

                    </div>
                </div>

                <!-- Track Info & Controls -->
                <div class="flex flex-col gap-4 w-full" style="color:#ffffff;">

                    <!-- Badges -->
                    <div class="flex items-center gap-3 flex-wrap">
                        <span id="player-mood-badge" class="font-headline font-bold uppercase px-3 py-1 brutal-border-3 text-xs tracking-widest shadow-brutal inline-block" style="background-color:#ffcc00;color:#1a1a1a;">MS: â€”</span>

                    <!-- Progress Bar -->

                        <div id="player-scrubber" class="w-full brutal-border-3 bg-white relative h-6 md:h-8" style="border-color:rgba(255,255,255,0.6);" title="Click to seek">

                            <div id="player-scrubber-thumb" class="absolute top-0 h-full w-[3px] bg-white left-0 -ml-px pointer-events-none"></div>
                        </div>
                    </div>

                    <!-- Transport Controls -->
                    <div class="flex items-center justify-between mt-1 gap-2 flex-wrap">
                        <button id="player-shuffle" class="transport-btn w-10 h-10" title="Shuffle" aria-label="Toggle shuffle">
                            <span class="material-symbols-outlined text-xl" style="font-variation-settings:'FILL' 1;">shuffle</span>
                        </button>
                        <div class="flex gap-2">
                            <button id="player-skip-prev" class="transport-btn w-12 h-12" title="Previous" aria-label="Skip previous">

                        </div>
                        <button id="player-repeat" class="transport-btn w-10 h-10" title="Repeat" aria-label="Toggle repeat">

                    </div>

    <!-- RIGHT: Queue Panel -->
