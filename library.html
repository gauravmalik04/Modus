<!DOCTYPE html>
<html class="light" lang="en">
<head>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>MODUS - Library</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Space+Grotesk:wght@400;500;600;700;800;900&amp;display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/library.css">
    <!-- Auth Guard: no session → back to login -->
    <script>
      try {
        if (!JSON.parse(sessionStorage.getItem('modus_session'))) {
          window.location.replace('login.html');
        }
      } catch(e) { window.location.replace('login.html'); }
    </script>
</head>
<body class="library-body">
    <!-- TopNavBar -->
    <header class="library-header">
        <div class="header-container">
            <div class="header-logo-group" style="gap: 1rem;">
                <button onclick="window.history.back()" aria-label="Go Back" title="Go Back" style="width:2rem;height:2rem;padding:0;display:flex;align-items:center;justify-content:center;background:#fff;border:4px solid #1a1a1a;box-shadow:4px 4px 0 0 #1a1a1a;cursor:pointer;">
                    <span class="material-symbols-outlined font-bold" style="font-size:1.25rem;">arrow_back</span>
                </button>
                <a class="header-logo-link" href="library.html">
                    <div class="header-logo-box brutalist-border brutalist-shadow">
                        <img src="static/logo.png" alt="MODUS Logo" class="header-logo-img">
                    </div>
                    <span class="header-logo-text">MODUS</span>
                </a>
            </div>
            <!-- Navigation Links (Web) -->
            <nav class="header-nav-links">
                <a class="nav-link nav-link-active" href="library.html">Library</a>
                <a class="nav-link" href="resequence.html">Sequencer</a>
            </nav>
            <div class="header-actions">
                <button id="logout-btn" class="signout-btn brutal-button" title="Sign Out">Sign Out</button>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="library-main">
        <!-- Header Section -->
        <section class="library-section-header">
            <div>
                <h1 class="library-title">Your <span>Library</span></h1>
            </div>
            <!-- Filters -->
            <div class="filters-group">
                <button class="filter-btn-active brutalist-button">
                    <span class="material-symbols-outlined">schedule</span> Recent
                </button>
                <button class="filter-btn brutalist-button">
                    <span class="material-symbols-outlined">favorite</span> Favorites
                </button>
                <button class="filter-btn brutalist-button">
                    <span class="material-symbols-outlined">tune</span> Mood Score
                </button>
            </div>
        </section>

        <!-- Grid -->
        <section class="library-grid" id="library-grid">
            <!-- Cards are injected dynamically by library.js -->
        </section>
    </main>

    <!-- Footer -->
    <footer class="library-footer">
        <div class="footer-logo">
            <img src="static/logo.png" alt="MODUS Logo">
        </div>
        <div class="footer-copyright">
            © 2024 MODUS SYSTEMS. ALL RIGHTS RESERVED.
        </div>
        <nav class="footer-nav">
            <a class="footer-link" href="#">Documentation</a>
            <a class="footer-link" href="#">API</a>
            <a class="footer-link" href="#">Status</a>
            <a class="footer-link" href="#">Privacy</a>
        </nav>
    </footer>
    <script type="module" src="js/pages/library.js"></script>
</body>
</html>
